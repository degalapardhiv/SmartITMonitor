services:

  db:

    image: postgres:16

    container_name: smart-monitor-db

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data



    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5



  backend:

    build:
      context: ./backend

    container_name: smart-monitor-api

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:

      db:
        condition: service_healthy

    environment:

      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    ports:
      - "8000:8000"

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 20s
      timeout: 5s
      retries: 5



  frontend:

    build:
      context: ./frontend

    container_name: smart-monitor-ui

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:

      backend:
        condition: service_healthy

    ports:
      - "80:80"



  prometheus:

    image: prom/prometheus:latest

    container_name: smart-monitor-prometheus

    restart: always

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"



  grafana:

    image: grafana/grafana:latest

    container_name: smart-monitor-grafana

    restart: always

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana


volumes:

  postgres_data:

  grafana_data:
